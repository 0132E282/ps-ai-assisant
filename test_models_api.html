<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Models</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #1a202c;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 800;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status {
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .status.loading {
            background: #fef3c7;
            color: #92400e;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .model-list {
            background: #f7fafc;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }

        .model-item {
            background: white;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            transition: all 0.2s;
        }

        .model-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .model-item:last-child {
            margin-bottom: 0;
        }

        .model-name {
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 4px;
            font-size: 15px;
        }

        .model-value {
            font-family: 'Monaco', 'Courier New', monospace;
            color: #667eea;
            font-size: 13px;
            background: #edf2f7;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        .default-badge {
            background: #48bb78;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 8px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
        }

        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .json-preview {
            background: #1a202c;
            color: #68d391;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🤖 API Models Test</h1>
        <p class="subtitle">Testing /api/models endpoint</p>

        <div id="status" class="status loading">⏳ Loading models...</div>

        <div id="result"></div>

        <button onclick="loadModels()">🔄 Reload Models</button>
    </div>

    <script>
        async function loadModels() {
            const statusEl = document.getElementById('status');
            const resultEl = document.getElementById('result');

            statusEl.className = 'status loading';
            statusEl.textContent = '⏳ Loading models...';
            resultEl.innerHTML = '';

            try {
                const response = await fetch('http://127.0.0.1:8000/api/models');
                const data = await response.json();

                if (data.models) {
                    statusEl.className = 'status success';
                    statusEl.textContent = `✅ Successfully loaded ${Object.keys(data.models).length} models`;

                    let html = '<div class="model-list">';

                    for (const [name, value] of Object.entries(data.models)) {
                        const isDefault = value === data.default_model;
                        html += `
                            <div class="model-item">
                                <div class="model-name">
                                    ${name}
                                    ${isDefault ? '<span class="default-badge">Default</span>' : ''}
                                </div>
                                <div class="model-value">${value}</div>
                            </div>
                        `;
                    }

                    html += '</div>';
                    html += `<div class="json-preview">${JSON.stringify(data, null, 2)}</div>`;

                    resultEl.innerHTML = html;
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = `❌ Error: ${error.message}`;
                resultEl.innerHTML = `<div class="json-preview">Error: ${error.stack}</div>`;
            }
        }

        // Auto-load on page load
        loadModels();
    </script>
</body>

</html>

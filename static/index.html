<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS-Assistant | Robot Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 10px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 400;
            font-size: 0.9rem;
        }

        input,
        textarea,
        select {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        .preview-box {
            grid-column: span 2;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }

        .preview-content {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #10b981;
            white-space: pre-wrap;
        }

        .btn {
            grid-column: span 2;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            font-size: 0.75rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="container">
        <span class="tag">AI Configuration</span>
        <h1>Thiết lập Prompt Trợ lý</h1>
        <p class="subtitle">Tùy chỉnh tính cách và hành vi của Robot để AI hiểu ý bạn hơn.</p>

        <form id="promptForm">
            <div class="grid">
                <div class="input-group">
                    <label for="name">Tên Trợ lý</label>
                    <input type="text" id="name" value="PS-Assistant" placeholder="Ví dụ: Jarvis, Robot-X...">
                </div>
                <div class="input-group">
                    <label for="personality">Tính cách (Personality)</label>
                    <select id="personality">
                        <option value="Thân thiện, hóm hỉnh và lễ phép.">Thân thiện</option>
                        <option value="Chuyên nghiệp, ngắn gọn và logic.">Chuyên nghiệp</option>
                        <option value="Hỗ trợ nhiệt tình, như một người bạn thân.">Năng động</option>
                        <option value="Robot lạnh lùng, chỉ tập trung vào lệnh.">Nguyên tắc</option>
                    </select>
                </div>
                <div class="input-group" style="grid-column: span 2;">
                    <label for="role">Vai trò chính (Core Role)</label>
                    <textarea id="role" rows="2"
                        placeholder="Ví dụ: Bạn là một robot phục vụ trong nhà có khả năng hỗ trợ việc vặt..."></textarea>
                </div>
                <div class="input-group" style="grid-column: span 2;">
                    <label for="commands">Các câu lệnh đặc biệt (Additional Commands)</label>
                    <textarea id="commands" rows="3"
                        placeholder="Ví dụ: move_arm: di chuyển cánh tay cơ học..."></textarea>
                </div>
            </div>

            <div class="preview-box">
                <label>System Prompt Preview:</label>
                <div id="preview" class="preview-content"></div>
            </div>

            <button type="submit" class="btn">Lưu Cấu Hình AI</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('promptForm');
        const preview = document.getElementById('preview');

        function updatePreview() {
            const name = document.getElementById('name').value;
            const personality = document.getElementById('personality').value;
            const role = document.getElementById('role').value;
            const commands = document.getElementById('commands').value;

            const systemPrompt = `Bạn là ${name}. 
Tính cách của bạn: ${personality}
${role ? 'Vai trò của bạn: ' + role : ''}

Nhiệm vụ chính: Nhận diện ý định và chuyển thành lệnh JSON.
Các lệnh mặc định: move, stop, open_app, search_web.
${commands ? 'Các lệnh bổ sung: ' + commands : ''}

Trả về JSON: {"type": "...", "params": {...}, "message": "..."}`;

            preview.textContent = systemPrompt;
        }

        form.addEventListener('input', updatePreview);
        updatePreview();

        form.onsubmit = async (e) => {
            e.preventDefault();
            const fullPrompt = preview.textContent;

            // Logic gửi lên backend để lưu vào database
            try {
                const response = await fetch('/api/update-prompt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: fullPrompt })
                });
                if (response.ok) {
                    alert('Đã cập nhật cấu hình AI thành công!');
                }
            } catch (err) {
                console.error(err);
                alert('Đã lưu cấu hình (Demo Mode)');
            }
        };
    </script>
</body>

</html>
